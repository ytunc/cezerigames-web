<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Cezeri Gear & Spark Icon -->
  <defs>
    <linearGradient id="c_grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="c_grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="c_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(6, 6)">
    <!-- Outer Glow Circle -->
    <circle cx="24" cy="24" r="23" stroke="url(#c_grad1)" stroke-width="2.5" fill="#0F172A" fill-opacity="0.85"/>
    
    <!-- Cezeri Mechanical Gear Teeth -->
    <path d="M24 7 L24 11 M24 37 L24 41 M7 24 L11 24 M37 24 L41 24 M12 12 L15 15 M33 33 L36 36 M12 36 L15 33 M33 12 L36 15" 
          stroke="url(#c_grad1)" stroke-width="3" stroke-linecap="round"/>

    <!-- Central Diamond / Brain / Play Shape -->
    <polygon points="24,13 35,24 24,35 13,24" fill="url(#c_grad1)" filter="url(#c_glow)"/>
    <!-- Play Core -->
    <polygon points="21,18 29,24 21,30" fill="#FFFFFF"/>
    
    <!-- Floating Spark -->
    <circle cx="36" cy="11" r="3" fill="url(#c_grad2)" />
  </g>

  <!-- Typography: CEZERI GAMES -->
  <text x="64" y="32" font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="21" letter-spacing="1.5" fill="#FFFFFF">CEZERI</text>
  <text x="156" y="32" font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="21" letter-spacing="1.5" fill="url(#c_grad1)">GAMES</text>
  <text x="65" y="47" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="8.5" letter-spacing="3" fill="#94A3B8">MOBILE GAME STUDIO</text>
</svg>
